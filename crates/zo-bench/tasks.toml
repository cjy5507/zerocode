# zo-bench task set. Everything the harness runs is defined HERE — tools,
# models, tasks, fixtures, checks. Edit freely; the binary hardcodes nothing.
#
#   cargo run -p zo-bench -- --tag smoke        # pipeline validation (cheap)
#   cargo run -p zo-bench --                    # full matrix
#   cargo run -p zo-bench -- --only fix-off-by-one --tool zo

[defaults]
timeout_secs = 420
check_timeout_secs = 120
trials = 1

# Both tools pinned to the SAME model so the harness measures the harness,
# not the model. Sessions are isolated per run: zo via ZO_SESSION_ROOT, CC by
# the throwaway workspace directory its project slug derives from.

[[tools]]
name = "zo"
# `--session-id X` both creates and continues session X, so multi-stage tasks
# reuse this argv for every stage (no resume_argv needed).
argv = [
    "zo",
    "--model", "claude-opus-5",
    "--session-id", "{session_id}",
    "--output-format", "json",
    "--permission-mode", "danger-full-access",
    "prompt", "{prompt}",
]
[tools.env]
ZO_SESSION_ROOT = "{run_root}/zo-sessions"

[[tools]]
name = "claude-code"
argv = [
    "claude",
    "-p", "{prompt}",
    "--model", "claude-opus-5",
    "--session-id", "{session_id}",
    "--output-format", "json",
    "--dangerously-skip-permissions",
]
# CC names a session with --session-id but CONTINUES one with --resume.
resume_argv = [
    "claude",
    "-p", "{prompt}",
    "--model", "claude-opus-5",
    "--resume", "{session_id}",
    "--output-format", "json",
    "--dangerously-skip-permissions",
]

# ── smoke: pipeline validator, cheapest possible ─────────────────────────────

[[tasks]]
id = "smoke-file"
tags = ["smoke"]
prompt = "Create a file named GREETING.txt in the current directory containing exactly the text: hello bench"
check = "python3 -c \"assert open('GREETING.txt').read().strip() == 'hello bench'\""
timeout_secs = 180

# ── real tasks ───────────────────────────────────────────────────────────────

[[tasks]]
id = "fix-off-by-one"
tags = ["small", "python"]
prompt = "Running `python3 test_calc.py` fails. Fix the bug in calc.py so the test passes. Do not modify test_calc.py."
check = "python3 test_calc.py"

[[tasks.files]]
path = "calc.py"
content = '''
def sum_range(a, b):
    """Sum of integers from a to b, inclusive on both ends."""
    total = 0
    for value in range(a, b):
        total += value
    return total
'''

[[tasks.files]]
path = "test_calc.py"
content = '''
from calc import sum_range

assert sum_range(1, 3) == 6, f"expected 6, got {sum_range(1, 3)}"
assert sum_range(5, 5) == 5, f"expected 5, got {sum_range(5, 5)}"
assert sum_range(0, 10) == 55, f"expected 55, got {sum_range(0, 10)}"
print("ok")
'''

