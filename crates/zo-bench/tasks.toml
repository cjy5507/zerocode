import ast
import importlib
import os
import pathlib
import re
import shutil
import subprocess
import sys
import tempfile

sys.path.insert(0, ".")

VOLUME_BAR = 2590
LINE = re.compile(
    r"^(?P<ts>\S+) (?P<node>\S+) req=(?P<req>\S+) level=(?P<level>\S+) "
    r"code=(?P<code>\S+) lat=(?P<latency>\d+)ms msg=(?P<msg>.*)$"
)


def corpus_truth():
    """Regenerate the corpus and derive the audited facts from it."""
    fresh = tempfile.mkdtemp()
    subprocess.run(
        [sys.executable, "make_audit_corpus.py", fresh], check=True, capture_output=True
    )
    nodes = {}
    for name in sorted(os.listdir(fresh)):
        text = pathlib.Path(fresh, name).read_text()
        mine = pathlib.Path("logs", name)
        assert mine.is_file(), f"logs/{name} is missing; the corpus was never generated"
        assert mine.read_text() == text, f"logs/{name} differs from the generated corpus"
        record = nodes.setdefault(name.rsplit("-", 1)[0], {"lines": 0, "token": None})
        rows = text.splitlines()
        record["lines"] += len(rows)
        for row in rows:
            if "level=FATAL" in row:
                record["token"] = row.split("audit token ")[1].strip()
    shutil.rmtree(fresh, ignore_errors=True)
    assert len(nodes) == 5, f"expected five audited nodes, found {sorted(nodes)}"
    for node, record in nodes.items():
        assert record["token"], f"harness error: no FATAL line found for {node}"
    return nodes


def audit_finding(node, record):
    """Judge one findings file against the corpus."""
    path = pathlib.Path("findings", node + ".md")
    assert path.is_file(), f"{path} is missing"
    text = path.read_text()
    assert text.endswith("\n") and not text.endswith("\n\n"), (
        f"{path} must end with exactly one newline"
    )
    rows = [row for row in text.splitlines() if row.strip()]
    assert len(rows) >= 10, (
        f"{path} needs at least 8 summary lines plus the two audit lines, found {len(rows)}"
    )
    assert rows[-2] == f"fatal-token: {record['token']}", f"{path}: {rows[-2]!r}"
    assert rows[-1] == f"lines: {record['lines']}", f"{path}: {rows[-1]!r}"


def imported_roots(node):
    """Top-level package names a single import statement pulls in."""
    if isinstance(node, ast.Import):
        return [alias.name.split(".")[0] for alias in node.names]
    if isinstance(node, ast.ImportFrom) and not node.level:
        return [(node.module or "").split(".")[0]]
    return []


def raised_name(node):
    """Name of the exception a raise statement names, dotted access included."""
    exc = node.exc
    if isinstance(exc, ast.Call):
        exc = exc.func
    if isinstance(exc, ast.Attribute):
        return exc.attr
    if isinstance(exc, ast.Name):
        return exc.id
    return None


rules = pathlib.Path("RULES.md").read_text()
assert "AuditError" in rules, "RULES.md must record the project rules"

# make_audit_corpus.py is the bench's own fixture, not something the session wrote.
modules = sorted(
    path
    for path in pathlib.Path(".").glob("*.py")
    if not path.name.startswith(("test_", "check_")) and path.name != "make_audit_corpus.py"
)
assert len(modules) >= 3, f"expected the audit modules, found {[str(m) for m in modules]}"
local = {path.stem for path in pathlib.Path(".").glob("*.py")}

seen_auditerror_raise = False
for path in modules:
    tree = ast.parse(path.read_text())
    for node in ast.walk(tree):
        for root in imported_roots(node):
            assert root in sys.stdlib_module_names or root in local, (
                f"{path} imports '{root}', but the rule is standard library only"
            )
        if isinstance(node, ast.Raise):
            name = raised_name(node)
            if name:
                assert name == "AuditError", f"{path} raises {name}, but the rule is AuditError only"
                seen_auditerror_raise = True
assert seen_auditerror_raise, "no AuditError raise found — the error rule was never exercised"

nodes = corpus_truth()
for node, record in sorted(nodes.items()):
    audit_finding(node, record)

