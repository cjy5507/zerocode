[[tasks]]
id = "rust-compile-fix"
tags = ["small", "rust"]
prompt = "`cargo build` fails in this crate. Fix src/main.rs so it compiles and `cargo run --quiet` prints: 15. Do not add dependencies."
# The check shell inherits the bench process env, where cargo may not be on
# PATH (first full run: BOTH tools "failed" this task because the check
# itself could not find cargo — a fixture defect, not a tool defect).
check = "PATH=\"$HOME/.cargo/bin:$PATH\" cargo run --quiet 2>/dev/null | grep -qx 15"

[[tasks.files]]
path = "Cargo.toml"
content = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2021"

[dependencies]
'''

[[tasks.files]]
path = "src/main.rs"
content = '''
fn sum(values: &[i32]) -> i32 {
    let mut total = 0;
    for value in values {
        total += value;
    }
    total
}

fn main() {
    let values = vec![1, 2, 3, 4, 5];
    let total: String = sum(&values);
    println!("{total}");
}
'''

# ── long lane: multi-stage tasks against ONE session ─────────────────────────
# The long-horizon axis: does the tool actually carry earlier conversation
# (facts, its own decisions) into later stages, and at what cumulative cost?
# Every stage is a separate headless invocation resuming the same session in
# the same workspace.

[[tasks]]
id = "long-recall-fact"
tags = ["long"]
# The password exists ONLY in the stage-1 conversation — never on disk. A tool
# whose resume is lossy (or whose compaction drops it) fails outright; a tool
# that carries it cheaply wins the cost axis.
check = '''test "$(cat password.txt)" = "quartz-HORIZON-42" && python3 test_util.py'''

[[tasks.stages]]
prompt = "Remember this fact for later in our session: the deploy password is quartz-HORIZON-42. Just acknowledge it. Do NOT write it to any file yet."

[[tasks.stages]]
prompt = "Create util.py with a function slugify(text) that lowercases text, trims it, and replaces every run of spaces with a single hyphen. Also create test_util.py with a few asserts covering those rules and run python3 test_util.py to confirm it passes."
check = "python3 test_util.py"

[[tasks.stages]]
prompt = "Now write the deploy password I told you at the start of this session to a file named password.txt — exactly the password, a single line, nothing else."

[[tasks]]
id = "long-decision-carry"
tags = ["long"]
# Stage 1 makes a naming decision; stages 2 and 3 must stay consistent with
# it. The check derives the chosen name from DECISIONS.md and requires the
# SAME name everywhere — a tool that re-derives instead of remembering
# diverges and fails.
check = '''
python3 - << 'PYEOF'
import re, pathlib
decisions = pathlib.Path("DECISIONS.md").read_text()
match = re.search(r"key:\s*([A-Z][A-Z0-9_]*_SECS)", decisions)
assert match, "DECISIONS.md must record 'key: <NAME>_SECS'"
key = match.group(1)
for path in ("config.py", "server.py", "README.md"):
    text = pathlib.Path(path).read_text()
    assert key in text, f"{path} must use the chosen key {key}"
print("consistent:", key)
PYEOF
python3 test_ttl.py'''

[[tasks.files]]
path = "config.py"
content = '''"""Project configuration constants."""

APP_NAME = "cachetron"
'''

[[tasks.files]]
path = "server.py"
content = '''"""Toy server that will need a cache TTL setting."""

import config


def get_ttl():
    """Return the cache TTL in seconds (to be wired to config)."""
    raise NotImplementedError
'''

[[tasks.files]]
path = "README.md"
content = '''# cachetron

A toy caching server.
'''

[[tasks.stages]]
prompt = "Look at this small project. Choose a config key name for the cache TTL setting — SCREAMING_SNAKE_CASE, ending in _SECS. Record your choice in a new DECISIONS.md file as a line 'key: <NAME>' and add the constant to config.py with value 300. Do not touch the other files yet."

[[tasks.stages]]
