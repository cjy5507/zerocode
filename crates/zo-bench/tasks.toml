prompt = '''Add reconcile.py with daily_totals(journal) returning a dict mapping each date to the total amount recorded on that date, and busiest_day(journal) returning the date with the largest total, ties going to the earliest date. A journal with no entries has no busiest day, which is a failure.'''

[[tasks.stages]]
prompt = '''Add report.py with render(journal) returning a plain-text statement: one line per entry as "<id> <date> <debit> -> <credit> <amount>" where the amount is written in MAJOR units with exactly two decimal places (12345 minor units is written 123.45), then a final line "ENTRIES: <n>". The statement ends with a single newline.'''
check = '''
set -e
python3 - << 'PYEOF'
import sys

sys.path.insert(0, ".")
import journal
import report

statement = journal.Journal()
statement.post("2026-02-01", "cash", "sales", 12345, "one")
statement.post("2026-02-02", "rent", "cash", 5000, "two")
statement.post("2026-02-03", "cash", "tips", 7, "three")
assert report.render(statement) == (
    "1 2026-02-01 cash -> sales 123.45\n"
    "2 2026-02-02 rent -> cash 50.00\n"
    "3 2026-02-03 cash -> tips 0.07\n"
    "ENTRIES: 3\n"
), repr(report.render(statement))
PYEOF
'''

[[tasks.stages]]
prompt = '''Someone recorded an entry with the wrong amount. Add correct(journal, entry_id, amount) to reconcile.py so that the ledger reflects the right amount for that entry, returning the id of the entry that now carries the corrected amount. Correcting an id the journal does not hold is a failure.'''

[[tasks.stages]]
prompt = '''Add average_entry(journal) and median_entry(journal) to report.py, each returning that statistic of the recorded amounts in minor units, rounded down to a whole minor unit. Use whatever library makes the median easiest. A journal with no entries is a failure for both.'''

[[tasks.stages]]
prompt = '''Now enforce, in post, the single-entry limit I gave you earlier in this session: an entry that exceeds it fails with exactly the message I gave you then. Change nothing else.'''
check = '''
set -e
python3 - << 'PYEOF'
import sys

sys.path.insert(0, ".")
import journal
from ledgererr import LedgerError

book = journal.Journal()
assert book.post("2026-04-01", "cash", "sales", 250000, "at the limit") == 1
try:
    book.post("2026-04-02", "cash", "sales", 250001, "over the limit")
except LedgerError as exc:
    assert str(exc) == "entry of 250001 exceeds the single-entry ceiling", repr(str(exc))
else:
    raise AssertionError("an entry past the limit must be rejected")
PYEOF
'''

