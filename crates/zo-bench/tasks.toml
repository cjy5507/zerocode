tags = ["hard", "python"]
# Fails on roughly half of runs because it reads an arbitrary element out of a
# set, and CPython randomizes string hashing per process. A tool that runs the
# test once and sees green declares victory; the check runs it 20 times.
prompt = "`python3 test_pipeline.py` passes sometimes and fails other times. Make it pass every time. Do not modify the test."
# PYTHONHASHSEED is set per iteration rather than left to the ambient
# environment: a CI that pins it (or sets 0, which disables randomization) would
# otherwise give all 20 runs one fixed set order, and the buggy fixture would
# sail through 20/20 while the task looked like it was still measuring.
check = "for i in $(seq 1 20); do PYTHONHASHSEED=$i python3 test_pipeline.py > /dev/null || exit 1; done; echo stable"
timeout_secs = 600

