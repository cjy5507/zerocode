[[tasks]]
id = "cross-file-email"
tags = ["medium", "python"]
prompt = "Add email support to this tiny user store: User gains an email field, UserStore.add takes it, and UserStore.find_by_email returns the matching user or None. `python3 test_store.py` must pass; do not modify test_store.py."
check = "python3 test_store.py"

[[tasks.files]]
path = "models.py"
content = '''
from dataclasses import dataclass


@dataclass
class User:
    user_id: int
    name: str
'''

[[tasks.files]]
path = "store.py"
content = '''
from models import User


class UserStore:
    def __init__(self):
        self._users = []

    def add(self, user_id, name):
        user = User(user_id=user_id, name=name)
        self._users.append(user)
        return user

    def find(self, user_id):
        for user in self._users:
            if user.user_id == user_id:
                return user
        return None
'''

[[tasks.files]]
path = "test_store.py"
content = '''
from store import UserStore

store = UserStore()
alice = store.add(1, "alice", "alice@example.com")
store.add(2, "bob", "bob@example.com")

assert alice.email == "alice@example.com"
assert store.find_by_email("bob@example.com").name == "bob"
assert store.find_by_email("nobody@example.com") is None
print("ok")
'''

