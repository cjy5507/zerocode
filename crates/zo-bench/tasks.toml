# zo-bench task set. Everything the harness runs is defined HERE — tools,
# models, tasks, fixtures, checks. Edit freely; the binary hardcodes nothing.
#
#   cargo run -p zo-bench -- --tag smoke        # pipeline validation (cheap)
#   cargo run -p zo-bench --                    # full matrix
#   cargo run -p zo-bench -- --only fix-off-by-one --tool zo

[defaults]
timeout_secs = 420
check_timeout_secs = 120
trials = 1

# Both tools pinned to the SAME model so the harness measures the harness,
# not the model. Sessions are isolated per run: zo via ZO_SESSION_ROOT, CC by
# the throwaway workspace directory its project slug derives from.

[[tools]]
name = "zo"
argv = [
    "zo",
    "--model", "claude-opus-5",
    "--output-format", "json",
    "--permission-mode", "danger-full-access",
    "prompt", "{prompt}",
]
[tools.env]
ZO_SESSION_ROOT = "{run_root}/zo-sessions"

[[tools]]
name = "claude-code"
argv = [
    "claude",
    "-p", "{prompt}",
    "--model", "claude-opus-5",
    "--output-format", "json",
    "--dangerously-skip-permissions",
]

# ── smoke: pipeline validator, cheapest possible ─────────────────────────────

[[tasks]]
id = "smoke-file"
tags = ["smoke"]
prompt = "Create a file named GREETING.txt in the current directory containing exactly the text: hello bench"
check = "python3 -c \"assert open('GREETING.txt').read().strip() == 'hello bench'\""
timeout_secs = 180

# ── real tasks ───────────────────────────────────────────────────────────────

[[tasks]]
id = "fix-off-by-one"
tags = ["small", "python"]
prompt = "Running `python3 test_calc.py` fails. Fix the bug in calc.py so the test passes. Do not modify test_calc.py."
check = "python3 test_calc.py"

[[tasks.files]]
path = "calc.py"
content = '''
def sum_range(a, b):
    """Sum of integers from a to b, inclusive on both ends."""
    total = 0
    for value in range(a, b):
        total += value
    return total
'''

[[tasks.files]]
path = "test_calc.py"
content = '''
from calc import sum_range

assert sum_range(1, 3) == 6, f"expected 6, got {sum_range(1, 3)}"
assert sum_range(5, 5) == 5, f"expected 5, got {sum_range(5, 5)}"
assert sum_range(0, 10) == 55, f"expected 55, got {sum_range(0, 10)}"
print("ok")
'''

[[tasks]]
id = "implement-median"
tags = ["small", "python"]
prompt = "Implement the median function in stats.py so `python3 test_stats.py` passes. Do not modify test_stats.py."
check = "python3 test_stats.py"

[[tasks.files]]
path = "stats.py"
content = '''
def median(values):
    """Median of a non-empty list of numbers."""
    raise NotImplementedError
'''

[[tasks.files]]
path = "test_stats.py"
content = '''
from stats import median

assert median([3, 1, 2]) == 2
assert median([4, 1, 2, 3]) == 2.5
assert median([7]) == 7
assert median([2.5, 1.5]) == 2.0
print("ok")
'''

[[tasks]]
id = "cross-file-email"
tags = ["medium", "python"]
prompt = "Add email support to this tiny user store: User gains an email field, UserStore.add takes it, and UserStore.find_by_email returns the matching user or None. `python3 test_store.py` must pass; do not modify test_store.py."
check = "python3 test_store.py"

[[tasks.files]]
path = "models.py"
content = '''
from dataclasses import dataclass


@dataclass
class User:
    user_id: int
    name: str
'''

[[tasks.files]]
path = "store.py"
content = '''
from models import User


class UserStore:
    def __init__(self):
        self._users = []

    def add(self, user_id, name):
        user = User(user_id=user_id, name=name)
        self._users.append(user)
        return user

    def find(self, user_id):
        for user in self._users:
            if user.user_id == user_id:
                return user
        return None
'''

[[tasks.files]]
path = "test_store.py"
content = '''
from store import UserStore

store = UserStore()
alice = store.add(1, "alice", "alice@example.com")
store.add(2, "bob", "bob@example.com")

assert alice.email == "alice@example.com"
assert store.find_by_email("bob@example.com").name == "bob"
assert store.find_by_email("nobody@example.com") is None
print("ok")
'''

[[tasks]]
id = "debug-blank-line"
tags = ["medium", "python"]
prompt = "`python3 report.py data.txt` crashes. Fix report.py so it prints the correct total; `python3 check_report.py` must pass. Do not modify data.txt or check_report.py."
check = "python3 check_report.py"

[[tasks.files]]
path = "report.py"
content = '''
import sys


def total_amounts(path):
    total = 0
    with open(path) as handle:
        for line in handle:
            fields = line.strip().split(",")
            total += int(fields[1])
    return total


if __name__ == "__main__":
    print(total_amounts(sys.argv[1]))
'''

[[tasks.files]]
path = "data.txt"
content = '''widget,10
gadget,25

gizmo,7

'''

[[tasks.files]]
path = "check_report.py"
content = '''
import subprocess

out = subprocess.run(
    ["python3", "report.py", "data.txt"],
    capture_output=True,
    text=True,
    check=True,
).stdout.strip()
assert out == "42", f"expected 42, got {out!r}"
print("ok")
'''

[[tasks]]
id = "cli-add-flag"
tags = ["medium", "python"]
prompt = "Add an `--upper` flag to shout.py: with the flag, the message prints uppercased; without it, behavior is unchanged. `python3 test_shout.py` must pass; do not modify test_shout.py."
check = "python3 test_shout.py"

[[tasks.files]]
path = "shout.py"
content = '''
import argparse


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("message")
    args = parser.parse_args()
    print(args.message)


if __name__ == "__main__":
    main()
'''

[[tasks.files]]
path = "test_shout.py"
content = '''
import subprocess


def run(*argv):
    return subprocess.run(
        ["python3", "shout.py", *argv], capture_output=True, text=True, check=True
    ).stdout.strip()


assert run("hello") == "hello"
assert run("hello", "--upper") == "HELLO"
assert run("--upper", "MiXeD") == "MIXED"
print("ok")
'''

[[tasks]]
id = "rust-compile-fix"
tags = ["small", "rust"]
prompt = "`cargo build` fails in this crate. Fix src/main.rs so it compiles and `cargo run --quiet` prints: 15. Do not add dependencies."
# The check shell inherits the bench process env, where cargo may not be on
# PATH (first full run: BOTH tools "failed" this task because the check
# itself could not find cargo — a fixture defect, not a tool defect).
check = "PATH=\"$HOME/.cargo/bin:$PATH\" cargo run --quiet 2>/dev/null | grep -qx 15"

[[tasks.files]]
path = "Cargo.toml"
content = '''
[package]
name = "fixture"
version = "0.1.0"
edition = "2021"

[dependencies]
'''

[[tasks.files]]
path = "src/main.rs"
content = '''
fn sum(values: &[i32]) -> i32 {
    let mut total = 0;
    for value in values {
        total += value;
    }
    total
}

fn main() {
    let values = vec![1, 2, 3, 4, 5];
    let total: String = sum(&values);
    println!("{total}");
}
'''
