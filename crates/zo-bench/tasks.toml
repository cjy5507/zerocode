content = '''
"""Deterministic audit-log corpus. The bench owns this file; do not modify it.

usage: python3 make_corpus.py <output-directory>

Every byte is a pure function of the service name and the line index, so the
corpus a check regenerates is the corpus the session read.
"""

import os
import sys

PARTS = ("a", "b", "c")
# Line volume per part. The audit's volume bar sits between these totals, and
# one service lands exactly on it.
VOLUMES = {
    "svc-3": (800, 800, 800),
    "svc-4": (817, 817, 816),
    "svc-5": (870, 870, 870),
    "svc-6": (750, 750, 750),
    "svc-7": (860, 860, 860),
}
CODES = ("E4102", "E4110", "E4203", "E5001", "E5104", "E6002", "E6110", "E6221")
LEVELS = ("INFO", "INFO", "INFO", "WARN", "INFO", "ERROR", "INFO", "WARN", "INFO", "ERROR")
STARTUP = (
    "loading shard manifest from cold storage",
    "warming the read-through cache for tenant set",
    "binding the ingest listener on the service port",
    "replaying the durable queue from the last checkpoint",
    "registering health probes with the supervisor",
    "opening the connection pool against the primary",
    "checking schema fingerprints before accepting traffic",
    "hydrating the routing table for the active region",
)
STEADY = (
    "served a batch read for the reporting tenant",
    "flushed the write buffer to the durable log",
    "renewed the lease on the partition assignment",
    "compacted the tail segment of the ingest queue",
    "answered a range scan from the warm cache",
    "rotated the request log without dropping traffic",
    "accepted a backfill window from the upstream feed",
    "verified a checkpoint against the replica digest",
    "trimmed expired sessions from the tracking map",
    "reissued a short lived token for the sidecar",
)
DEGRADED = (
    "retrying the upstream fetch after a reset connection",
    "shedding load because the queue depth crossed the mark",
    "falling back to the replica after a primary timeout",
    "observed clock drift against the coordination service",
    "cache warm-up lagging behind the write volume",
    "partial response returned while the shard rebalances",
    "backpressure applied to the ingest listener",
    "deferred compaction because the disk budget is thin",
)


def numbers(seed):
    """Endless deterministic pseudo-random stream."""
    state = seed % 2147483647 or 12345
    while True:
        state = (state * 1103515245 + 12345) % 2147483648
        yield state


def seed_of(text):
    """Stable seed for a piece of text."""
    total = 7919
    for char in text:
        total = (total * 131 + ord(char)) % 2147483647
    return total


def audit_token(service):
    """The eight hex digits sealed into this service's FATAL line."""
    stream = numbers(seed_of(service + "-audit-seal"))
    # High bits only: consecutive states of a small LCG share their low bits,
    # and two services must never draw look-alike tokens.
    return "".join("%x" % (next(stream) // 65536 % 16) for _ in range(8))


def phrases(index, total):
    """Phase-appropriate message pool for a line at this position."""
    if index * 4 < total:
        return STARTUP
    if index * 4 < total * 3:
        return STEADY
    return DEGRADED


def write_part(directory, service, part, count, offset, total, fatal_at):
    """Write one part file and return the number of lines it holds."""
    stream = numbers(seed_of(service + part))
    lines = []
    for index in range(count):
        position = offset + index
        pool = phrases(position, total)
        minute, second = divmod(position, 60)
        hour, minute = divmod(minute, 60)
        day, hour = divmod(hour, 24)
        stamp = "2026-03-%02dT%02d:%02d:%02dZ" % (3 + day, hour, minute, second)
        req = "%06x" % (next(stream) % 16777216)
        if position == fatal_at:
            lines.append(
                "%s %s req=%s level=FATAL code=E9001 lat=0ms "
                "msg=incident sealed with audit token %s" % (stamp, service, req, audit_token(service))
            )
            continue
        level = LEVELS[next(stream) % len(LEVELS)]
        code = CODES[next(stream) % len(CODES)]
        latency = 12 + next(stream) % 900
        message = pool[next(stream) % len(pool)]
        lines.append(
            "%s %s req=%s level=%s code=%s lat=%dms msg=%s"
            % (stamp, service, req, level, code, latency, message)
        )
    path = os.path.join(directory, "%s-%s.log" % (service, part))
    with open(path, "w", encoding="utf-8") as handle:
        handle.write("\n".join(lines) + "\n")
    return count


def main(argv):
    """Generate the corpus into the directory named on the command line."""
    if len(argv) != 1:
        print("usage: python3 make_corpus.py <output-directory>")
        return 2
    directory = argv[0]
    os.makedirs(directory, exist_ok=True)
    written = 0
    for service, volumes in sorted(VOLUMES.items()):
        total = sum(volumes)
        # One FATAL line per service, in the middle part, at a stable offset.
        fatal_at = volumes[0] + volumes[1] // 3
        offset = 0
        for part, count in zip(PARTS, volumes):
            written += write_part(directory, service, part, count, offset, total, fatal_at)
            offset += count
    print("wrote %d lines across %d services" % (written, len(VOLUMES)))
    return 0


if __name__ == "__main__":
    sys.exit(main(sys.argv[1:]))
'''

