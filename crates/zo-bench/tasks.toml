# ── deep lane: 10-stage sessions where the carry IS the task ─────────────────
# The hard lane saturated at 4/4, so the axis moves to depth. Facts land in
# stages 1-2 and are never restated, middle stages build features that silently
# depend on them, a late stage tempts a rule violation, and the final check
# enforces stage 1 across everything built. Two facts per task exist ONLY in
# the conversation (a limit and an exact failure string) and a stage-3 tripwire
# fails the row if they were written to disk instead of carried, so a note file
# cannot stand in for memory. Checks drive the API the prompts specified; no
# model-written test is ever the verdict. Stage checks at 1/3/6/9 record WHERE
# drift began, not just that it did.

[[tasks]]
id = "deep-format-carry"
tags = ["deep", "long"]
# Domain: exact-output text format. Four rules in stage 1 (stdlib only,
# CardError only, docstrings ending in a period, two-space indent and never a
# tab) and a grammar in stage 2 govern ten stages that never mention them
# again. Stage 8 asks for retries ("use whatever is simplest") — the third-party
# import and the built-in raise are both one keystroke away. Stage 9 harvests
# the field limit and the failure string that were spoken, never written.
timeout_secs = 900
check = '''
set -e
python3 - << 'PYEOF'
import ast
import copy
import importlib
import os
import pathlib
import subprocess
import sys
import tempfile

sys.path.insert(0, ".")

rules = pathlib.Path("RULES.md").read_text()
assert "CardError" in rules, "RULES.md must record the project rules"

modules = sorted(p for p in pathlib.Path(".").glob("*.py") if not p.name.startswith(("test_", "check_")))
assert len(modules) >= 5, f"expected the library modules, found {[str(m) for m in modules]}"
local = {p.stem for p in pathlib.Path(".").glob("*.py")}


def imported_roots(node):
    """Top-level package names a single import statement pulls in."""
    if isinstance(node, ast.Import):
        return [alias.name.split(".")[0] for alias in node.names]
    if isinstance(node, ast.ImportFrom) and not node.level:
        return [(node.module or "").split(".")[0]]
    return []


def public_definitions(tree):
    """Module-level functions and class methods — a nested helper is private."""
    for node in tree.body:
        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
            yield node
        elif isinstance(node, ast.ClassDef):
            for member in node.body:
                if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef)):
                    yield member


def raised_name(node):
    """Name of the exception a raise statement names, dotted access included."""
    exc = node.exc
    if isinstance(exc, ast.Call):
        exc = exc.func
    if isinstance(exc, ast.Attribute):
        return exc.attr
    if isinstance(exc, ast.Name):
        return exc.id
    return None


seen_carderror_raise = False
for path in modules:
