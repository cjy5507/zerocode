# ── long lane: multi-stage tasks against ONE session ─────────────────────────
# The long-horizon axis: does the tool actually carry earlier conversation
# (facts, its own decisions) into later stages, and at what cumulative cost?
# Every stage is a separate headless invocation resuming the same session in
# the same workspace.

[[tasks]]
id = "long-recall-fact"
tags = ["long"]
# The password exists ONLY in the stage-1 conversation — never on disk. A tool
# whose resume is lossy (or whose compaction drops it) fails outright; a tool
# that carries it cheaply wins the cost axis.
