check = "python3 test_ttl.py"

[[tasks.stages]]
prompt = "Document the configuration: add a Configuration section to README.md that names the exact TTL key you chose earlier and its default. Keep it consistent with DECISIONS.md."

[[tasks]]
id = "long-iterative-feature"
tags = ["long"]
# Three incremental builds on the same module: measures the cumulative token
# economics of a growing session (cache health, history re-billing) with a
# straightforward always-passable spec.
check = "python3 test_calc.py && python3 main.py add 2 3 | grep -qx '5'"

[[tasks.stages]]
prompt = "Create calc.py with add(a, b) and sub(a, b), and test_calc.py covering both. Run python3 test_calc.py to confirm."
check = "python3 test_calc.py"

